<dialog class="driver-confirm-dialog" data-driver-dialog aria-labelledby="driver-confirm-title">
  <h2 id="driver-confirm-title">Confirmar cambios</h2>
  <p>Se realizarán estas modificaciones:</p>
  <ul data-driver-changes></ul>
  <p>¿Deseas guardar esta configuración?</p>
  <div class="actions"><button class="button button-secondary" type="button" data-driver-cancel>Cancelar</button><button class="button button-primary" type="button" data-driver-accept>Sí, guardar cambios</button></div>
</dialog>
