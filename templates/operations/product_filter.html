<section class="panel"><form method="get" class="search-bar"><label for="list-product">Producto</label><select class="form-select" name="product" id="list-product"><option value="">Todos</option>{% for p in products %}<option value="{{ p.code }}" {% if request.GET.product == p.code %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select>{% if request.GET.q %}<input type="hidden" name="q" value="{{ request.GET.q }}">{% endif %}<button class="button button-secondary">Filtrar</button></form></section>
